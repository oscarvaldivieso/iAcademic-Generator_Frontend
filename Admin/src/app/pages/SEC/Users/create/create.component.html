<div class="modal-dialog modal-dialog-centered" role="document">
  <div class="modal-content">
    <div class="modal-header">
      <h5 class="modal-title">Nuevo Usuario</h5>
      <button type="button" class="btn-close" (click)="onClose()" aria-label="Close"></button>
    </div>
    <div class="modal-body">
      <!-- Mensajes de éxito/error -->
      <div *ngIf="successMessage" class="alert alert-success">
        <i class="ri-check-line me-2"></i> {{ successMessage }}
      </div>
      <div *ngIf="errorMessage" class="alert alert-danger">
        <i class="ri-error-warning-line me-2"></i> {{ errorMessage }}
      </div>

      <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
        <div class="row">
          <!-- Código de Usuario -->
          <div class="col-md-6 mb-3">
            <label class="form-label">N° Cuenta <span class="text-danger">*</span></label>
            <input type="text" class="form-control" formControlName="usu_codigo" 
                   [ngClass]="{ 'is-invalid': userForm.get('usu_codigo')?.touched && userForm.get('usu_codigo')?.errors }">
            <div class="invalid-feedback" *ngIf="userForm.get('usu_codigo')?.touched && userForm.get('usu_codigo')?.errors?.['required']">
              El número de cuenta es requerido
            </div>
          </div>

          <!-- Nombre -->
          <div class="col-md-6 mb-3">
            <label class="form-label">Nombre Completo <span class="text-danger">*</span></label>
            <input type="text" class="form-control" formControlName="usu_nombre"
                   [ngClass]="{ 'is-invalid': userForm.get('usu_nombre')?.touched && userForm.get('usu_nombre')?.errors }">
            <div class="invalid-feedback" *ngIf="userForm.get('usu_nombre')?.touched && userForm.get('usu_nombre')?.errors?.['required']">
              El nombre es requerido
            </div>
          </div>

          <!-- Email -->
          <div class="col-md-6 mb-3">
            <label class="form-label">Correo Electrónico <span class="text-danger">*</span></label>
            <input type="email" class="form-control" formControlName="usu_email"
                   [ngClass]="{ 'is-invalid': userForm.get('usu_email')?.touched && userForm.get('usu_email')?.errors }">
            <div class="invalid-feedback" *ngIf="userForm.get('usu_email')?.touched && userForm.get('usu_email')?.errors?.['required']">
              El correo electrónico es requerido
            </div>
            <div class="invalid-feedback" *ngIf="userForm.get('usu_email')?.touched && userForm.get('usu_email')?.errors?.['email']">
              Ingrese un correo electrónico válido
            </div>
          </div>

          <!-- Contraseña -->
          <div class="col-md-6 mb-3">
            <label class="form-label">Contraseña <span class="text-danger">*</span></label>
            <input type="password" class="form-control" formControlName="usu_password"
                   [ngClass]="{ 'is-invalid': userForm.get('usu_password')?.touched && userForm.get('usu_password')?.errors }">
            <div class="invalid-feedback" *ngIf="userForm.get('usu_password')?.touched && userForm.get('usu_password')?.errors?.['required']">
              La contraseña es requerida
            </div>
            <div class="invalid-feedback" *ngIf="userForm.get('usu_password')?.touched && userForm.get('usu_password')?.errors?.['minlength']">
              La contraseña debe tener al menos 6 caracteres
            </div>
          </div>

          <!-- Es Estudiante -->
          <div class="col-md-6 mb-3">
            <div class="form-check form-switch mt-4">
              <input class="form-check-input" type="checkbox" id="esEstudiante" [(ngModel)]="esEstudiante" [ngModelOptions]="{standalone: true}">
              <label class="form-check-label" for="esEstudiante">
                <i class="ri-graduation-cap-line me-1"></i> Es Estudiante
              </label>
            </div>
          
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-light" (click)="onClose()" [disabled]="isLoading">
            <i class="ri-close-line align-middle me-1"></i> Cancelar
          </button>
          <button type="submit" class="btn btn-primary" [disabled]="isLoading || userForm.invalid">
            <span *ngIf="!isLoading">
              <i class="ri-save-line align-middle me-1"></i> Guardar
            </span>
            <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
            <span *ngIf="isLoading">Guardando...</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
