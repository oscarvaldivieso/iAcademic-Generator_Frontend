<div class="d-flex flex-column" style="height: 100%; min-height: 250px;">
    <!-- Título del componente -->
    <h5 class="card-title mb-4">Crear Nueva Área</h5>
    
    <!-- Contenedor de alertas flotantes -->
    <div class="alert-container">
      <!-- Alerta de éxito -->
      <div *ngIf="mostrarAlertaExito" class="alert alert-success alert-border-left alert-dismissible show floating-alert" role="alert">
        <i class="ri-check-double-line me-3 align-middle fs-lg"></i>
        <strong>¡Éxito!</strong> {{ mensajeExito }}
        <button type="button" class="btn-close" (click)="cerrarAlerta()" aria-label="Close"></button>
      </div>
      
      <!-- Alerta de advertencia -->
      <div *ngIf="mostrarAlertaWarning" class="alert alert-warning alert-border-left alert-dismissible show floating-alert" role="alert">
        <i class="ri-alert-line me-3 align-middle fs-lg"></i>
        <strong>¡Atención!</strong> {{ mensajeWarning }}
        <button type="button" class="btn-close" (click)="cerrarAlerta()" aria-label="Close"></button>
      </div>
      
      <!-- Alerta de error -->
      <div *ngIf="mostrarAlertaError" class="alert alert-danger alert-border-left alert-dismissible fade show floating-alert" role="alert">
        <i class="ri-error-warning-line me-3 align-middle fs-lg"></i>
        <strong>¡Error!</strong> {{ mensajeError }}
        <button type="button" class="btn-close" (click)="cerrarAlerta()" aria-label="Close"></button>
      </div>
    </div>
    
    <div class="flex-grow-1">
      <div class="row">
        <!-- Código del Área -->
        <div class="col-md-6 mb-3">
          <label for="codigoArea" class="form-label">Código del Área <span class="text-danger">*</span></label>
          <input 
            type="text" 
            class="form-control" 
            [class.is-invalid]="!area.are_codigo?.trim() && mostrarErrores"
            id="codigoArea"
            [(ngModel)]="area.are_codigo"
            name="are_codigo"
            placeholder="Ej: CS, MAT, FIS"
            required>
          <div class="invalid-feedback" *ngIf="!area.are_codigo?.trim() && mostrarErrores">
            El código del área es requerido
          </div>
        </div>

        <!-- Nombre del Área -->
        <div class="col-md-6 mb-3">
          <label for="nombreArea" class="form-label">Nombre del Área <span class="text-danger">*</span></label>
          <input 
            type="text" 
            class="form-control" 
            [class.is-invalid]="!area.are_nombre?.trim() && mostrarErrores"
            id="nombreArea"
            [(ngModel)]="area.are_nombre"
            name="are_nombre"
            placeholder="Ej: Ciencias de la Computación"
            required>
          <div class="invalid-feedback" *ngIf="!area.are_nombre?.trim() && mostrarErrores">
            El nombre del área es requerido
          </div>
        </div>
      </div>
    </div>
    
    <div class="mt-auto pt-3">
      <div class="row">
        <div class="col-12">
          <div class="d-flex justify-content-end gap-2">
            <button type="button" class="btn btn-primary gold" (click)="cancelar()">
              <span class="btn-text">Cancelar</span>
              <span class="btn-icon"><i class="ri-close-circle-line"></i></span>
            </button>
            <button type="button" class="btn btn-primary" (click)="guardar()">
              <span class="btn-text">Guardar</span>
              <span class="btn-icon"><i class="ri-save-line"></i></span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
